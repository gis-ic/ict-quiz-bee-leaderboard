<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Leaderboard · ICT Quiz Bee</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#020604; --panel:rgba(6,24,16,.7); --line:rgba(0,255,140,.16); --line-bright:rgba(0,255,140,.4);
    --green:#00ff8c; --green-dim:#0a9d5e; --green-deep:#063b24; --ink:#d7ffe9; --ink-soft:#7fcaa3; --muted:#4d7d63;
    --gold:#ffd23f; --silver:#cfe0ff; --bronze:#ff9d5c;
    --easy:#00ff8c; --medium:#ffd23f; --hard:#ff5d6d;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden;}
.mono{font-family:'JetBrains Mono',monospace;}
#rain{position:fixed;inset:0;z-index:0;opacity:.4;}
.scanlines{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.3;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.2) 3px);}
.wrap{position:relative;z-index:5;max-width:1100px;margin:0 auto;padding:28px 26px 60px;}

.head{text-align:center;margin-bottom:28px;}
.head .school{font-family:'JetBrains Mono';font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--ink-soft);}
.head .fest{font-family:'JetBrains Mono';font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--green-dim);margin-top:4px;}
.head h1{font-size:clamp(30px,6vw,52px);font-weight:700;letter-spacing:-1px;margin-top:14px;}
.head h1 .g{color:var(--green);text-shadow:0 0 30px rgba(0,255,140,.4);}
.head .live{display:inline-flex;align-items:center;gap:9px;margin-top:14px;font-family:'JetBrains Mono';font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--green);border:1px solid var(--line-bright);border-radius:30px;padding:7px 16px;}
.head .live .pip{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pip 1.4s infinite;}
@keyframes pip{0%,100%{opacity:1;}50%{opacity:.3;}}

/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:10px 0 36px;flex-wrap:wrap;}
.pcol{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:150px;}
.pcard{width:100%;border-radius:16px 16px 0 0;border:1px solid var(--line-bright);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:18px 14px;text-align:center;background:linear-gradient(180deg,rgba(0,255,140,.12),rgba(0,255,140,.02));}
.pcard .rank{font-family:'JetBrains Mono';font-weight:800;font-size:13px;position:absolute;top:10px;letter-spacing:1px;}
.pcard .medal{font-size:34px;margin-bottom:6px;}
.pcard .pname{font-weight:700;font-size:17px;line-height:1.2;}
.pcard .pscore{font-family:'JetBrains Mono';font-weight:800;font-size:30px;margin-top:6px;}
.pcard.first{height:210px;border-color:var(--gold);box-shadow:0 0 40px rgba(255,210,63,.2);background:linear-gradient(180deg,rgba(255,210,63,.18),transparent);}
.pcard.first .pscore,.pcard.first .rank{color:var(--gold);}
.pcard.second{height:170px;border-color:var(--silver);background:linear-gradient(180deg,rgba(207,224,255,.14),transparent);}
.pcard.second .pscore,.pcard.second .rank{color:var(--silver);}
.pcard.third{height:140px;border-color:var(--bronze);background:linear-gradient(180deg,rgba(255,157,92,.14),transparent);}
.pcard.third .pscore,.pcard.third .rank{color:var(--bronze);}

/* table */
.board-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.board-head h2{font-family:'JetBrains Mono';font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);}
.refresh-note{font-family:'JetBrains Mono';font-size:11px;color:var(--muted);}
.row{display:grid;grid-template-columns:54px 1fr auto auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 20px;margin-bottom:9px;backdrop-filter:blur(6px);transition:.4s;}
.row.lead{border-color:var(--gold);background:linear-gradient(90deg,rgba(255,210,63,.08),var(--panel));}
.row .rk{font-family:'JetBrains Mono';font-weight:800;font-size:19px;color:var(--ink-soft);}
.row.lead .rk{color:var(--gold);}
.row .who{min-width:0;}
.row .tname{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .tmembers{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.row .lvl{font-family:'JetBrains Mono';font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid var(--line);}
.row .sc{font-family:'JetBrains Mono';font-weight:800;font-size:26px;color:var(--green);min-width:70px;text-align:right;}
.row .breakdown{display:flex;gap:5px;margin-top:5px;}
.row .seg{height:5px;border-radius:3px;}

.empty{text-align:center;padding:70px 20px;color:var(--muted);}
.empty i{font-size:52px;margin-bottom:18px;color:var(--green-deep);}
.empty .mono{font-size:13px;letter-spacing:1px;margin-top:10px;}

.setup-banner{background:rgba(255,210,63,.07);border:1px solid rgba(255,210,63,.3);border-radius:12px;padding:16px 18px;margin-bottom:24px;font-size:13.5px;color:#ffe08a;display:flex;gap:12px;line-height:1.5;}
.setup-banner i{color:var(--gold);font-size:18px;margin-top:1px;}
.setup-banner code{background:rgba(0,0,0,.4);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono';font-size:12px;}

@media (max-width:640px){
  .row{grid-template-columns:40px 1fr auto;}
  .row .lvl{display:none;}
  .pcol{min-width:110px;}
  .head h1{font-size:30px;}
}
@media (prefers-reduced-motion:reduce){#rain{display:none;}*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="scanlines"></div>
<div class="wrap">
  <div class="head">
    <div class="school">Golden International School</div>
    <div class="fest">Academic Festival 2026</div>
    <h1>ICT Quiz Bee · <span class="g">Live Standings</span></h1>
    <div class="live"><span class="pip"></span> Live · updates every 8s</div>
    <button id="fsBtn" onclick="toggleFS()" title="Fullscreen for projector"
      style="margin-left:10px;background:transparent;border:1px solid var(--line-bright);color:var(--ink-soft);border-radius:30px;padding:7px 14px;font-family:'JetBrains Mono';font-size:12px;letter-spacing:1px;cursor:pointer;">
      <i class="fas fa-expand"></i> Fullscreen
    </button>
  </div>
  <div id="board"></div>
  <div style="text-align:center;margin-top:40px;font-family:'JetBrains Mono';font-size:12px;letter-spacing:1.5px;color:var(--muted)">
    ICT Quiz Bee · Academic Festival 2026 · <span style="color:var(--green);text-shadow:0 0 12px rgba(0,255,140,.5)">Teacher Rommel</span>
  </div>
</div>

<script>
/* ====== CONFIG: paste the SAME Apps Script Web App URL used in the quiz app ====== */
const CONFIG = { SHEET_URL: "" };

const LEVELS={easy:{c:"#00ff8c",max:40},medium:{c:"#ffd23f",max:60},hard:{c:"#ff5d6d",max:110},digital:{c:"#34f5e0",max:42}};
const board=document.getElementById('board');

/* digital rain */
(function(){const c=document.getElementById('rain'),x=c.getContext('2d');let cols,drops,fs=16;
const g="01ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜICTBINARY<>[]{}=+";
function rz(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/fs);drops=Array(cols).fill(1);}
rz();addEventListener('resize',rz);
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
setInterval(()=>{x.fillStyle="rgba(2,6,4,.1)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#00ff8c";x.font=fs+"px JetBrains Mono";
for(let i=0;i<drops.length;i++){const ch=g[Math.floor(Math.random()*g.length)];x.globalAlpha=Math.random()*.5+.25;x.fillText(ch,i*fs,drops[i]*fs);if(drops[i]*fs>c.height&&Math.random()>.975)drops[i]=0;drops[i]++;}x.globalAlpha=1;},80);
})();

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function toggleFS(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  else { document.exitFullscreen && document.exitFullscreen(); }
}
document.addEventListener('fullscreenchange',()=>{
  const b=document.getElementById('fsBtn');
  if(b) b.innerHTML = document.fullscreenElement ? '<i class="fas fa-compress"></i> Exit' : '<i class="fas fa-expand"></i> Fullscreen';
});

function renderEmpty(msg, setup){
  board.innerHTML = (setup?`
    <div class="setup-banner"><i class="fas fa-circle-info"></i>
    <div>No live connection yet. Paste your Apps Script Web App URL into <code>CONFIG.SHEET_URL</code> at the top of this file's script to show real-time standings. Until then, this page waits quietly.</div></div>`:'')
    + `<div class="empty"><i class="fas fa-trophy"></i><div style="font-size:18px;font-weight:600">${esc(msg)}</div>
       <div class="mono">Teams will appear here the moment they register.</div></div>`;
}

function podiumHTML(top3){
  const order=[top3[1],top3[0],top3[2]];   // 2nd, 1st, 3rd visual
  const cls=["second","first","third"], medal=["🥈","🥇","🥉"], rk=["#2","#1","#3"];
  return `<div class="podium">${order.map((t,i)=>t?`
    <div class="pcol"><div class="pcard ${cls[i]}">
      <span class="rank">${rk[i]}</span>
      <div class="medal">${medal[i]}</div>
      <div class="pname">${esc(t.team)}</div>
      <div class="pscore mono">${t.score}</div>
    </div></div>`:'').join("")}</div>`;
}

function rowHTML(t,i){
  const lead=i===0;
  const segs=["easy","medium","hard","digital"].map(k=>{
    const v=t[k]||0, w=Math.max(6, Math.min(60, v));
    return `<span class="seg" style="width:${6+v*1.2}px;background:${LEVELS[k].c}"></span>`;
  }).join("");
  return `<div class="row ${lead?'lead':''}">
    <span class="rk mono">${i+1}</span>
    <div class="who">
      <div class="tname">${lead?'<i class="fas fa-crown" style="color:var(--gold);margin-right:6px"></i>':''}${esc(t.team)}</div>
      <div class="tmembers">${esc(t.members||'')}</div>
      <div class="breakdown">${segs}</div>
    </div>
    <span class="lvl" style="color:${LEVELS[t.level]?LEVELS[t.level].c:'var(--ink-soft)'}">${esc(statusText(t))}</span>
    <span class="sc mono">${t.score}</span>
  </div>`;
}
function statusText(t){
  if(t.status && /finish/i.test(t.status)) return "Finished";
  const names={easy:"Easy",medium:"Medium",hard:"Hard",digital:"Digital"};
  return names[t.level]||t.level||"Easy";
}

function render(teams){
  if(!teams || !teams.length){ renderEmpty("Waiting for teams…", !CONFIG.SHEET_URL); return; }
  const top3=teams.slice(0,3);
  board.innerHTML =
    (teams.length>=3?podiumHTML(top3):'') +
    `<div class="board-head"><h2><i class="fas fa-ranking-star"></i> All teams (${teams.length})</h2>
       <span class="refresh-note mono" id="rnote">updated just now</span></div>` +
    teams.map(rowHTML).join("");
}

async function poll(){
  if(!CONFIG.SHEET_URL){ renderEmpty("Leaderboard not connected", true); return; }
  try{
    const r=await fetch(CONFIG.SHEET_URL, {method:"GET"});
    const d=await r.json();
    if(d && d.ok) render(d.teams||[]);
  }catch(e){ /* keep last view on a hiccup */ }
}
poll();
setInterval(poll, 8000);
</script>
</body>
</html>
